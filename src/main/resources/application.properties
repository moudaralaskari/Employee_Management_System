spring.application.name=Employee_System
# Server
server.port=8080
# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/employee_System?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logging
logging.level.org.hibernate.SQL=DEBUG
# Security
jwt.secret=${JWT_SECRET}
# EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_APP_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
backend.origin=http://localhost:8080
spring.sql.init.mode=never